<!doctype html> <html lang="fa" dir="rtl"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>مدیریت | هنرستان فن آموز</title> <link rel="stylesheet" href="style.css"> </head> <body> <header class="top"> <div class="brand"> <div class="logo">ف</div> <div> <h1>پنل مدیریت</h1> <small>هنرستان فن آموز</small> </div> </div> <a class="back" href="index.html">← سایت</a> </header> <main class="admin"> <div id="login" class="panel"> <h2>ورود مدیر</h2> <input id="pass" type="password" placeholder="رمز مدیریت"> <button onclick="login()">ورود</button> <p id="err"></p> </div> <div id="dash" class="panel hidden"> <div class="section-title"> <span>ویرایش اطلاعات سایت</span> <button class="small" onclick="logout()">خروج</button> </div> <h3>متن صفحه اصلی</h3> <input id="mainTitle" placeholder="عنوان اصلی"> <textarea id="mainText" placeholder="متن معرفی"></textarea> <input id="address" placeholder="نشانی"> <input id="phone" placeholder="تلفن"> <button onclick="saveSite()">ذخیره اطلاعات</button> <hr> <h3>مدیریت اخبار</h3> <form id="form"> <input id="title" required placeholder="عنوان خبر"> <textarea id="body" required placeholder="متن خبر"></textarea> <button>افزودن خبر</button> </form> <div id="adminNews"></div> <hr> <h3>تغییر رمز مدیریت</h3> <input id="newpass" type="password" placeholder="رمز جدید"> <button onclick="changePass()">ذخیره رمز</button> <p class="muted"> تغییرات این نسخه در مرورگر همین دستگاه ذخیره می‌شوند. </p> </div> </main> <script src="app.js"></script> </body> </html>
